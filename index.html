<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malaika Fatima — CS Student, Aspiring AI Developer</title>
<meta name="description" content="Portfolio of Malaika Fatima, a Computer Science student focused on AI, building AI-assisted security tools and interactive web projects. Project Sentinel, Jade Lantern and Birthday Experience.">
<meta property="og:title" content="Malaika Fatima — Portfolio">
<meta property="og:description" content="Computer Science student · Aspiring AI Developer">
<meta name="theme-color" content="#02070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="style.css?v=16">
<link rel="stylesheet" href="hub.css?v=16">
<link rel="stylesheet" href="chatbot.css?v=16">
<link rel="stylesheet" href="gate.css?v=16">
<link rel="stylesheet" href="guide.css?v=16">
</head>
<body>
<!-- Who is visiting? Hologram gate that replaces the old loading bar -->
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gateGrid" aria-hidden="true"></div>
  <div class="gateHolo" id="gateHolo">
    <i class="gc tl"></i><i class="gc tr"></i><i class="gc bl"></i><i class="gc br"></i>
    <div class="gateScan" aria-hidden="true"></div>
    <p class="gateEyebrow">// IDENTITY CHECK</p>
    <h1 id="gateTitle">Who&rsquo;s visiting?</h1>
    <p class="gateSub">Choose your path and I&rsquo;ll tailor the experience.</p>
    <div class="gateCards" id="gateCards">
      <button type="button" class="gateCard" data-mode="recruiter" data-hint="Recruiter? I&rsquo;ll skip the intro videos and show you the 30-second brief.">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="9" width="34" height="30" rx="4"/><circle cx="19" cy="21" r="5"/><path d="M11 33c1-5 4-7 8-7s7 2 8 7"/><path d="M30 19h7M30 25h7M30 31h5"/></svg>
        <b>Recruiter</b><span>Hiring? Skip the cinematic and get the 30-second brief.</span><em>~30 sec</em>
      </button>
      <button type="button" class="gateCard" data-mode="client" data-hint="Client? I&rsquo;ll take you straight to the projects and live demos.">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5l16 9v20L24 43 8 34V14z"/><path d="M8 14l16 9 16-9M24 23v20"/></svg>
        <b>Client</b><span>Have a project? See my work, live demos and how to reach me.</span><em>~1 min</em>
      </button>
      <button type="button" class="gateCard" data-mode="viewer" data-hint="Viewer? Sit back &mdash; the full cinematic experience, start to end.">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18"/><path d="M20 15l14 9-14 9z"/></svg>
        <b>Viewer</b><span>Just exploring? Take the full cinematic tour, start to end.</span><em>full tour</em>
      </button>
    </div>
    <div class="gateProg" id="gateProg" aria-live="polite">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="rb" cx="22" cy="22" r="19"/><circle class="rf" id="gateRing" cx="22" cy="22" r="19"/></svg>
      <span id="gatePct">0%</span><span class="gateProgTxt">Preparing the lab&hellip;</span>
    </div>
  </div>
</div>
<main id="stage">

  <!-- Scene 1: door video + zoom layer -->
  <div id="zoomLayer">
    <video id="doorVideo" playsinline webkit-playsinline preload="auto"></video>
    <!-- Transparent hidden button placed exactly over the door's "OPEN" panel -->
    <button id="openHotspot" type="button" aria-label="Open the door"></button>
  </div>

  <!-- Arrow hint for the door button (3 seconds after load) -->
  <div id="doorArrow" class="arrowHint hidden" aria-hidden="true">
    <svg viewBox="0 0 60 30" width="60" height="30"><path d="M2 15h46M36 4l13 11-13 11" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <!-- Scene 2: lab video (plays after the light is switched on) -->
  <video id="labVideo" class="hidden" playsinline webkit-playsinline preload="auto"></video>

  <!-- Full black overlay (fades in at the end of the zoom, fades out when light is on) -->
  <div id="blackout"></div>

  <!-- Light switch, top right of the black screen -->
  <button id="lightBtn" type="button" role="switch" aria-checked="false" aria-label="Turn on the light" class="hidden">
    <span class="lbl" id="lightLbl">OFF</span>
    <span class="track"><span class="knob"></span></span>
  </button>

  <!-- Hidden button over the capsule's small screen + 3-second arrow hint -->
  <button id="capsuleHotspot" type="button" class="hidden" aria-label="Open the capsule"></button>
  <div id="arrowHint" class="arrowHint hidden" aria-hidden="true">
    <svg viewBox="0 0 60 30" width="60" height="30"><path d="M2 15h46M36 4l13 11-13 11" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <!-- Scene 3: videos that play after the capsule is opened -->
  <video id="nextVideo" class="hidden" playsinline webkit-playsinline preload="auto"></video>
  <video id="nextVideo2" class="hidden" playsinline webkit-playsinline preload="auto"></video>

  <!-- Final scene: circuit lines draw "WELCOME TO MY PORTFOLIO" -->
  <section id="welcome" class="hidden" aria-label="Welcome to my portfolio">
    <h1 class="sr-only">Welcome to my portfolio</h1>
    <svg id="circuit" aria-hidden="true"></svg>
  </section>

  <!-- Scene 4: close-up intro -->
  <section id="intro" class="scene hidden" aria-label="Introduction">
    <div class="kb">
      <img id="introImg" class="sceneImg" alt="">
      <div id="eyeL" class="eye"></div><div id="eyeR" class="eye"></div>
      <div id="beamBar"></div>
    </div>
    <div class="introScrim"></div>
    <div id="introText">
      <p class="eyebrow" id="introEyebrow">// SYSTEM ONLINE</p>
      <h2 id="introName" aria-live="polite"></h2>
      <p class="role" id="introRole"></p>
      <p class="line" id="introLine"></p>
      <button id="introBtn" class="holoBtn" type="button">Enter the lab &#9656;</button>
    </div>
  </section>

</main>


<!-- Beam flash used by the transition (outside #stage so it survives the swap) -->
<div id="flash"></div>

<!-- The scrolling site: hologram hub -> project capsules -> contact -->
<div id="site" class="hidden">

  <section id="hub" aria-label="About me">
    <img id="hubImg" alt="">
    <div id="handGlow"></div>
    <div id="robotBubble" aria-live="polite"><span></span></div>
    <div id="hubPanel" tabindex="-1">
      <header id="hubHead"></header>
      <div id="hubBody" aria-live="polite"></div>
      <footer id="hubNavBar">
        <div id="hubDots"></div>
        <button id="hubPrev" type="button" aria-label="Previous card">&#8249;</button>
        <button id="hubNext" type="button"><span>Next</span><i>&#8250;</i></button>
      </footer>
    </div>
    <a id="hubResume" class="hidden" href="#" target="_blank" rel="noopener">Resume (PDF)</a>
    <button id="scrollCue" type="button" aria-label="Scroll down to projects"><span>Projects</span><i></i></button>
  </section>

  <section id="capsules" aria-label="Projects">
    <img id="capBg" class="secBg" alt="">
    <div class="secShade"></div>
    <header class="secHead">
      <p class="eyebrow">// PROJECT CAPSULES</p>
      <h2>My Projects</h2>
      <p class="hint" id="capHint">Open a capsule to see the full story.</p>
    </header>
    <div id="capTrack" class="capTrack"></div>
  </section>

  <section id="contact" aria-label="Contact">
    <img id="contactBg" class="secBg" alt="">
    <div class="secShade contactShade"></div>
    <div id="contactPanel"></div>
    <p class="foot" id="siteFoot"></p>
  </section>
</div>

<!-- Project detail window (opens after a capsule opens) -->
<div id="projModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="pmName"></div>

<script src="data.js?v=16"></script>
<script src="script.js?v=16"></script>
<script src="hub.js?v=16"></script>
<script src="site.js?v=16"></script>
<script src="brain.js?v=16"></script>
<script src="guide.js?v=16"></script>
<script src="chatbot.js?v=16"></script>
<script src="gate.js?v=16"></script>
</body>
</html>
